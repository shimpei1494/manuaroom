name: CI

on:
  pull_request:
  push:
    branches: [main]

# check と test は独立に並列実行し、片方が落ちてももう片方の結果が見えるようにする
jobs:
  check:
    name: check (format / lint / typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vite+ と Node.js をセットアップし、依存関係のキャッシュと vp install まで行う
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "22"
          cache: true
      - run: vp check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "22"
          cache: true
      - run: vp test

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vite+ と Node.js をセットアップし、依存関係のキャッシュと vp install まで行う
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "22"
          cache: true
      - run: vp check
      - run: vp test

name: Deploy

# GitHub でリリースを公開したら本番 (Cloudflare Workers) にデプロイする。
# main へのマージでは出さず、リリースでまとめて出す運用 (docs/deployment.md「自動デプロイ」)。
# 手動で出し直したいときは Actions タブの Run workflow から実行できる。
on:
  release:
    types: [published]
  workflow_dispatch:

# 2 つのデプロイが重ならないようにする。途中のデプロイは止めずに終わるまで待つ
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # シークレットを扱うので、外部の Action はタグではなくコミット SHA で固定する
    # (タグが付け替えられても中身が変わらないように)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "26"
          cache: true
      # 新しいコードが新しい列を使うので、先にマイグレーションを当ててからデプロイする。
      # 未適用のものだけが当たるので、DB に変更がないリリースでは何もしない
      # トークンは依存関係のインストール (setup-vp) には渡さず、wrangler を動かすステップだけに渡す
      - run: vp run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
